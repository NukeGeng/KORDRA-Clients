name: Clients repository validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test standalone repository boundaries
        run: python3 -m unittest discover -s tests -v
      - name: Validate scaffold and Product reference
        run: python3 tools/check_repository.py
      - name: Check whitespace
        run: git diff --check

  desktop-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Desktop dependencies
        run: npm ci
      - name: Check Desktop TypeScript
        run: npm run typecheck
      - name: Test local preview workflows
        run: npm test
      - name: Install Chromium for Desktop browser tests
        run: npx playwright install --with-deps chromium
      - name: Test Desktop routes and interactions in Chromium
        run: npm run test:ui
      - name: Build Desktop web preview
        run: npm run build
      - name: Audit Desktop dependencies
        run: npm audit --audit-level=moderate

  website-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test homepage motion behavior
        run: node --test website/tests/reveal.test.cjs
      - name: Test website theme integrity
        run: python3 -m unittest discover -s website/tests -v
      - name: Validate isolated Compose configuration
        run: docker compose --env-file website/dev/.env.example --project-directory website/dev -f website/dev/compose.yaml config --quiet
      - name: Lint theme PHP with its WordPress PHP runtime
        run: website/dev/lint-php.sh
      - name: Start isolated WordPress and run HTTP smoke checks
        run: |
          cp website/dev/.env.example website/dev/.env
          sed -i \
            -e 's/local-only-change-this/ci-database-password-8d4f2a/' \
            -e 's/local-only-root-change-this/ci-root-password-17b9ce/' \
            -e 's/local-only-change-before-use/ci-admin-password-6a0e31/' \
            website/dev/.env
          website/dev/setup-local.sh
          docker compose --env-file website/dev/.env --project-directory website/dev -f website/dev/compose.yaml run --rm wpcli 'wp eval-file /test-editorial-check.php'
          website/dev/setup-local.sh
          python3 website/dev/smoke-test.py
        env:
          KORDRA_SMOKE_FEATURES_TITLE_MARKER: editorial title check
          KORDRA_SMOKE_FEATURES_BODY_MARKER: editor body check features
          KORDRA_SMOKE_DOCUMENTATION_TITLE_MARKER: editorial title check
          KORDRA_SMOKE_DOCUMENTATION_BODY_MARKER: editor body check documentation
          KORDRA_SMOKE_RELEASES_TITLE_MARKER: editorial title check
          KORDRA_SMOKE_RELEASES_BODY_MARKER: editor body check releases
      - name: Remove only the isolated KORDRA website Compose project
        if: always()
        run: |
          if [ -f website/dev/.env ]; then
            docker compose --env-file website/dev/.env --project-directory website/dev -f website/dev/compose.yaml down -v --remove-orphans
          fi
      - name: Check whitespace
        run: git diff --check
